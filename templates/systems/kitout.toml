# Systems / Embedded Engineer — a kitout starting point.
# Sub-categories: Rust systems, C/C++, embedded/firmware, WebAssembly.
# Keep the sub-category sections you want in Brewfile + skills/manifest, drop the rest.
# MCP: rust-docs-mcp keeps crate APIs current; embedded-debugger-mcp (probe-rs) needs a probe attached.
sudo = true

[[step]]
type = "brewfile"
id = "brewfile"
path = "Brewfile"

[[step]]
type = "skills"
id = "skills"
manifest = "skills/manifest"

