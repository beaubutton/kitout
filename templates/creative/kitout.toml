# Creative Technologist — a kitout starting point.
# Sub-categories: gen-image, gen-audio, video/motion, creative coding.
# Keep the sub-category sections you want in Brewfile + skills/manifest, drop the rest.
# MCP: artokun/comfyui-mcp works via Comfy Cloud (no local box); blender-mcp for 3D.
sudo = true

[[step]]
type = "brewfile"
id = "brewfile"
path = "Brewfile"

[[step]]
type = "skills"
id = "skills"
manifest = "skills/manifest"

