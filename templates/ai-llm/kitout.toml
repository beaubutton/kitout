# AI / LLM Application Engineer — a kitout starting point.
# Sub-categories: Claude app dev, agent frameworks & MCP, RAG & vector search, LLM eval.
# Keep the sub-category sections you want in Brewfile + skills/manifest, drop the rest.
# MCP: No maintained RAG skill exists yet; qdrant/chroma + langfuse MCP fill the gap.
sudo = true

[[step]]
type = "brewfile"
id = "brewfile"
path = "Brewfile"

[[step]]
type = "skills"
id = "skills"
manifest = "skills/manifest"

