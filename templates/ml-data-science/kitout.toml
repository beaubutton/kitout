# ML / Data Scientist — a kitout starting point.
# Sub-categories: PyTorch/MLX, notebooks, classical ML, MLOps.
# Keep the sub-category sections you want in Brewfile + skills/manifest, drop the rest.
# MCP: Skill coverage is sparse; the Jupyter/HuggingFace/DuckDB MCP servers carry more weight here.
sudo = true

[[step]]
type = "brewfile"
id = "brewfile"
path = "Brewfile"

[[step]]
type = "skills"
id = "skills"
manifest = "skills/manifest"

