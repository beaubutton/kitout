# Custom dist publish job: publish to crates.io via Trusted Publishing (OIDC).
# No long-lived token anywhere — the runner exchanges its identity for a
# 30-minute token at publish time. Requires the GitHub repo + this workflow
# to be registered as a Trusted Publisher in the crate's settings on
# crates.io.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  id-token: write # OIDC token exchange
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
