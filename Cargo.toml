[package]
name = "kitout"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The agent-era workstation bootstrapper — declarative, DAG-executed machine setup"
repository = "https://github.com/beaubutton/kitout"
keywords = ["bootstrap", "dotfiles", "provisioning", "agents", "mcp"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
similar = "2"
dialoguer = "0.11"
console = "0.15"
shellexpand = "3"
ureq = "2"
flate2 = "1"
tar = "0.4"
tempfile = "3"
